[project]
name = "umashow"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "icnsutil>=1.1.0",
    "pillow>=12.0.0",
    "protobuf>=6.33.2",
    "requests>=2.32.5",
]

[project.optional-dependencies]
larc-graph = [
    "numpy>=1.24.1,<2",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "nvidia-cudnn-cu12==9.1.0.70; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nccl-cu12==2.21.5; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "wandb==0.12.16",
    "onnx>=1.17,<2",
    "onnxruntime>=1.22,<1.23",
    "LightZero @ git+https://github.com/opendilab/LightZero.git@9ccf29b3c2174f65e06d21c3d0c51dc76853f37f",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
