name: Publish

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    env:
      npm_config_msvs_version: '2022'

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Install Node and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Electron native dependencies
        run: npm run prepare:app-deps

      - name: Build recommendation components
        run: python python/build_monte_carlo.py

      - name: Verify Unicode resource paths
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'UmaShow 推荐路径 🚀'
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $database = Join-Path $testRoot '推荐数据 🚀.json'
          Copy-Item -LiteralPath 'assets/data/monte_carlo.json' -Destination $database

          $normalOutput = '' | & 'assets/native/UmaShowMonteCarlo.exe' $database | Out-String
          $larcOutput = '' | & 'assets/native/UmaShowMonteCarloLArc.exe' $database | Out-String
          if ($normalOutput -notmatch '"type":"ready"') {
            throw "Normal recommendation component failed Unicode path check: $normalOutput"
          }
          if ($larcOutput -notmatch '"type":"ready"') {
            throw "LArc recommendation component failed Unicode path check: $larcOutput"
          }

      - name: Build
        run: npm run build

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm exec electron-builder -- --publish always --win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ./.erb/scripts/verify-packaged-deps.js
